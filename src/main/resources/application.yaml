spring:
  application:
    name: course-manager-api
  
  datasource:
    url: jdbc:h2:mem:universitydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true # Podremos entrar a http://localhost:8080/h2-console
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # Crea/Actualiza las tablas automáticamente
    show-sql: true # Veremos las queries en la consola (útil para depurar N+1)
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080